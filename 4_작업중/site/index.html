<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크리에이티브 인덱스 · 미감·양식·전략 통합 위키</title>
  <meta name="description" content="아름다움의 원리(미감), 미술·디자인 양식(양식사), 카피·발상의 법칙(전략)을 한곳에 모은 크리에이티브 지식 색인.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231d2138' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%231d2138'/%3E%3C/svg%3E">
  <script>
    // 테마 초기화(FOUC 방지): 저장값 > 시스템 선호
    (function () {
      var t;
      try { t = localStorage.getItem('ckw_theme'); } catch (e) { /* noop */ }
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="https://use.typekit.net/idm0yfz.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Cardo&family=Dancing+Script&family=EB+Garamond&family=JetBrains+Mono&family=Libre+Baskerville&family=Open+Sans&family=Playfair+Display&family=Poppins&family=Roboto+Slab:wght@400;700&family=UnifrakturMaguntia&family=Work+Sans:wght@400;600&display=swap">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

        <button id="themeToggle" class="theme-toggle" aria-label="라이트/다크 모드 전환">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

        </button>

  <footer class="site-footer">
